<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Sales Dashboard 2026</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
table { border-collapse: collapse; width: 100%; margin-top: 10px; }
th, td { border: 1px solid #ccc; padding: 6px; }
th { background: #f4f4f4; cursor: pointer; }
tr:hover { background: #fafafa; }
.negative { color: crimson; font-weight: bold; }
.positive { color: darkgreen; font-weight: bold; }
</style>
</head>
<body>

<h1>Sales Dashboard 2026</h1>

Periodo:
<select id="periodSelect"></select>

<table id="table"></table>

<script>
const DATA_PATH = "data/sales_q1_2026.json";
const LEVELS = ["Sektor","Salesperson","Customer"];

let rawData = [];
let levelIndex = 0;
let filters = {};
let sortCol = "delta";
let sortAsc = false;

fetch(DATA_PATH)
  .then(response => response.json())
  .then(data => {
    rawData = data;
    initPeriods();
    render();
  })
  .catch(err => alert("JSON Fehler: " + err));

function initPeriods() {
  const select = document.getElementById("periodSelect");
  select.innerHTML = "";

  const optAll = document.createElement("option");
  optAll.value = "ALL";
  optAll.textContent = "Alle Perioden";
  select.appendChild(optAll);

  const periods = Array.from(new Set(rawData.map(r => r.Period))).sort();

  const names = {
    "01":"Gennaio","02":"Febbraio","03":"Marzo","04":"Aprile",
    "05":"Maggio","06":"Giugno","07":"Luglio","08":"Agosto",
    "09":"Settembre","10":"Ottobre","11":"Novembre","12":"Dicembre"
  };

  periods.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    const parts = p.split("-");
    opt.textContent = names[parts[1]] + " " + parts[0];
    select.appendChild(opt);
  });

  select.onchange = render;
}

function render() {
  const table = document.getElementById("table");
  table.innerHTML = "";

  const period = document.getElementById("periodSelect").value;
  const level = LEVELS[levelIndex];

  const data = rawData.filter(r =>
    (period === "ALL" || r.Period === period) &&
    Object.keys(filters).every(f => r[f] === filters[f])
  );

  const map = {};
  data.forEach(r => {
    const key = r[level] || "(leer)";
    if (!map[key]) map[key] = { u:0, b:0 };
    map[key].u += Number(r.Umsatz)||0;
    map[key].b += Number(r.Budget)||0;
  });

  const rows = Object.keys(map).map(k => ({
    key:k, u:map[k].u, b:map[k].b, d:map[k].u - map[k].b
  }));

  rows.sort((a,b) => sortAsc ? a[sortCol]-b[sortCol] : b[sortCol]-a[sortCol]);

  const head = document.createElement("tr");
  head.innerHTML =
    "<th>"+level+"</th>"+
    "<th onclick='sort(\"u\")'>Umsatz</th>"+
    "<th onclick='sort(\"b\")'>Budget</th>"+
    "<th onclick='sort(\"d\")'>Delta</th>";
  table.appendChild(head);

  rows.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>"+r.key+"</td>"+
      "<td>"+r.u.toLocaleString()+"</td>"+
      "<td>"+r.b.toLocaleString()+"</td>"+
      "<td class='"+(r.d<0?"negative":"positive")+"'>"+
      r.d.toLocaleString()+"</td>";
    tr.onclick = () => drill(r.key);
    table.appendChild(tr);
  });
}

function drill(val) {
  if (levelIndex >= LEVELS.length-1) return;
  filters[LEVELS[levelIndex]] = val;
  levelIndex++;
  render();
}

function sort(col) {
  sortCol = col;
  sortAsc = !sortAsc;
  render();
}
</script>

</body>
</html>
